<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Expense & Budget Tracker</h2>
    <div class="summary-card">
      <div class="balance-section">
        <h4>Your Balance</h4>
        <h1 id="balance">Rs.0.00</h1>
      </div>
      <div class="inc-exp-container">
        <div class="inc-box">
          <h4>Income</h4>
          <p id="money-plus" class="money plus">+Rs.0.00</p>
        </div>
        <div class="exp-box">
          <h4>Expense</h4>
          <p id="money-minus" class="money minus">-Rs.0.00</p>
        </div>
      </div>
    </div>
    <div class="chart-container">
      <canvas id="expenseChart"></canvas>
    </div>
    <h3>Add New Transaction</h3>
    <form id="form">
      <div class="form-control">
        <label for="text">Text (Description)</label>
        <input type="text" id="text" placeholder="Enter text..." />
      </div>
      <div class="form-control">
        <label for="category">Category</label>
        <select id="category">
          <option value="Food">Food & Drinks</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills & Utilities</option>
          <option value="Rent">Rent & Housing</option>
          <option value="Salary">Salary / Income</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-control">
        <label for="amount">Amount <br /> (negative - expense, positive - income)</label>
        <input type="number" id="amount" placeholder="Enter amount..." />
      </div>
      <button class="btn">Add transaction</button>
    </form>
    <h3>Transaction History</h3>
    <ul id="list" class="list"></ul>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
